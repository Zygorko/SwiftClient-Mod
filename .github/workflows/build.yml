name: Build SwiftClient 1.8.9 Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 4.10.3
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-4.10.3-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /opt/gradle
          ln -sf /opt/gradle/gradle-4.10.3/bin/gradle /usr/local/bin/gradle
          gradle -v

      - name: Build with Gradle
        run: gradle build --no-daemon --stacktrace

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: swiftclient-1.8.9-mod
          path: build/libs/*.jar
